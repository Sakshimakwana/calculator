          - asset: assets/fonts/Lato-Regular.ttf
          - asset: assets/fonts/Lato-Bold.ttf
            weight: 700
          - asset: assets/fonts/Lato-Black.ttf
            weight: 900
    - family: ModernStoreInter
      fonts:
          - asset: assets/fonts/modern_store_home_inter_regular.ttf
            weight: 400
