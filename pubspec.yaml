name: app_matic_tech_flutter_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  font_awesome_flutter: ^11.0.0
  lucide_icons_flutter: ^3.1.15

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0




flutter:
  uses-material-design: true

  fonts:
    - family: MakeThingsSans
      fonts:
        - asset: fonts/Make-Things-Sans.ttf

    - family: SFProRounded
      fonts:
        - asset: fonts/SF-Pro-Rounded-Bold.ttf
          weight: 700

    - family: NotoSansGujarati
      fonts:
        - asset: fonts/Noto_Sans_Gujarati/NotoSansGujarati-VariableFont_wdth,wght.ttf

    - family: NotoSansDevanagari
      fonts:
        - asset: fonts/Noto_Sans_Devanagari/NotoSansDevanagari-VariableFont_wdth,wght.ttf

    - family: RobotoSlabBlack
      fonts:
        - asset: fonts/Roboto-Slab-Black.ttf
          weight: 700
    - family: ArialMTStditalic
      fonts:
        - asset: fonts/Arial-MT-Std-italic.ttf
          weight: 700
  assets:
    - assets/images/profile.jpg
    - assets/images/background_image.png
    - assets/images/gift_box.png
    - assets/images/appointment.png