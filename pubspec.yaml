name: app_matic_tech_flutter_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  font_awesome_flutter: ^11.0.0
  lucide_icons_flutter: ^3.1.15
  lottie: ^3.3.1
  audioplayers: ^6.5.0
  dotlottie_flutter: ^0.1.7
  go_router: ^16.2.0
  shared_preferences: ^2.5.3
  speech_to_text: ^7.0.0
  shimmer: ^3.0.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  dio: ^5.11.1
  provider: ^6.1.5+1
  pdf: ^3.13.1
  printing: ^5.14.0
  path_provider: ^2.1.5
  syncfusion_flutter_pdfviewer: ^35.1.37
  file_saver: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

